name: hermes-home

services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    command: gateway run
    environment:
      HERMES_DASHBOARD: "1"
    ports:
      - "${HERMES_DASHBOARD_BIND:-0.0.0.0}:9119:9119"
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/hermes:/opt/data
      - ./scripts/container-health.py:/opt/bedrock-health.py:ro
    healthcheck:
      test: ["CMD", "python3", "/opt/bedrock-health.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
