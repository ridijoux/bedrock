name: ${COMPOSE_PROJECT_NAME:-hermes-home}

services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    command: gateway run
    environment:
      HERMES_DASHBOARD: "1"
      # Older deployed images may lack these locations in their image PATH.
      # Keep the current image shim first, then venv and legacy user CLIs.
      PATH: "/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/games:/usr/games"
    ports:
      - "${HERMES_DASHBOARD_BIND:-0.0.0.0}:${HERMES_DASHBOARD_PORT:-9119}:9119"
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${HERMES_DATA_DIR:-/opt/hermes-home/data/hermes}:/opt/data
      # Debian 13 on both host and container; do not create a directory if
      # the host package is missing. /usr/local/bin is already on PATH.
      - type: bind
        source: /usr/bin/gh
        target: /usr/local/bin/gh
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          memory: 4G
