name: hermes-home

services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    command: gateway run
    environment:
      HERMES_DASHBOARD: "1"
      # Older deployed images may lack these locations in their image PATH.
      # Keep the current image shim first, then venv and legacy user CLIs.
      PATH: "/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/games:/usr/games"
    ports:
      - "${HERMES_DASHBOARD_BIND:-0.0.0.0}:9119:9119"
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /opt/hermes-home/data/hermes:/opt/data
      - ./scripts/container-health.py:/opt/bedrock-health.py:ro
    networks:
      - default
      - gatelet-agent
    healthcheck:
      test: ["CMD", "python3", "/opt/bedrock-health.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  gatelet:
    image: ${GATELET_IMAGE:-ghcr.io/hannesill/gatelet:0.2.4}
    restart: unless-stopped
    environment:
      GATELET_DATA_DIR: /data
    ports:
      - "127.0.0.1:4001:4001" # Admin only; reach remotely with SSH forwarding.
    volumes:
      - /opt/hermes-home/data/gatelet:/data
    networks:
      - gatelet-agent
      - default # Outbound OAuth/provider API access.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gatelet-agent:
    internal: true
