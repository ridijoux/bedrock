# Gonzabot only. Saruman loads compose.yaml without this override.
services:
  hermes:
    networks:
      - default
      - gatelet-agent

  gatelet:
    image: ${GATELET_IMAGE:-ghcr.io/hannesill/gatelet:0.2.4}
    restart: unless-stopped
    environment:
      GATELET_DATA_DIR: /data
    ports:
      - "127.0.0.1:${GATELET_ADMIN_PORT:-4001}:4001" # Admin only; reach remotely with SSH forwarding.
    volumes:
      - ${HERMES_HOME:-/opt/hermes-home}/data/gatelet:/data
    networks:
      - gatelet-agent
      - default # Outbound OAuth/provider API access.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gatelet-agent:
    internal: true
